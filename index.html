<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12171F">
<meta name="description" content="A walking tour of the nine oldest brown cafes in Amsterdam.">
<title>De Kroegentocht &middot; Amsterdam</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%2312171F'/><rect x='6' y='6' width='20' height='20' fill='%233E6FA8'/></svg>">
<style>
  html,body{margin:0;padding:0;background:#12171F;-webkit-text-size-adjust:100%}
  *{-webkit-tap-highlight-color:rgba(201,162,39,.25)}
</style>

<!-- ─────────────────────────────────────────────────────────────────────
     CONFIG — the only part you need to edit.

     Leave supabaseUrl/supabaseKey empty and the app runs in solo mode:
     everything works, progress saves on the phone, but friends won't
     appear on the board.

     Fill them in (free Supabase project, see README) and the group board
     turns on. The anon key is safe to publish — that's what it's for.

     "room" is the group name. Anyone opening ?room=xyz joins that group.
     ───────────────────────────────────────────────────────────────── -->
<script>
  window.KROEG_CONFIG = {
    supabaseUrl: "",
    supabaseKey: "",
    room: "amsterdam"
  };
</script>
